version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jcm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jcm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-jcm_bsv32}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jcm_admin} -d ${POSTGRES_DB:-jcm_bsv32}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jcm-net

  redis:
    image: redis:7-alpine
    container_name: jcm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jcm-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jcm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/logs:/app/logs
      - ./docs:/app/docs:ro
    networks:
      - jcm-net

  agents-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jcm-agents-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      WORKER_MODE: true
    command: ["python", "-m", "app.workers.agent_scheduler"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/logs:/app/logs
      - ./docs:/app/docs:ro
    networks:
      - jcm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jcm-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - jcm-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: jcm-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - jcm-net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  jcm-net:
    driver: bridge
