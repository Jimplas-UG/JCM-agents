# JCM BSv3.2 Supervisory Platform - production stack (Linux containers only)
# On Windows Server with Docker Windows containers, use: .\scripts\deploy-native.ps1
# Usage: copy .env.example → .env, set secrets, then: .\scripts\deploy.ps1

services:
  postgres:
    image: postgres:16-alpine
    container_name: jcm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jcm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jcm_bsv32}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jcm_admin} -d ${POSTGRES_DB:-jcm_bsv32}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jcm-net

  redis:
    image: redis:7-alpine
    container_name: jcm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jcm-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jcm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      METRICS_REQUIRE_AUTH: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_BIND:-0.0.0.0}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/logs:/app/logs
      - ./docs:/app/docs:ro
    networks:
      - jcm-net

  agents-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jcm-agents-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      WORKER_MODE: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.workers.agent_scheduler"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/logs:/app/logs
      - ./docs:/app/docs:ro
    networks:
      - jcm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
        NEXT_PUBLIC_API_KEY: ${API_SECRET_KEY:-}
    container_name: jcm-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - jcm-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: jcm-prometheus
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./infra/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jcm-net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  jcm-net:
    driver: bridge
