<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JCM CEO Copilot — BSv3.2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #050505;
      --black-soft: #0a0a0a;
      --panel: #111111;
      --panel-hover: #161616;
      --gold: #c9a227;
      --gold-light: #e8c547;
      --gold-dim: #8a7020;
      --gold-glow: rgba(201, 162, 39, 0.25);
      --text: #f5f0e6;
      --muted: #9a9080;
      --border: rgba(201, 162, 39, 0.22);
      --border-strong: rgba(201, 162, 39, 0.45);
      --green: #4ade80;
      --red: #f87171;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201,162,39,.08), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(201,162,39,.04), transparent);
    }
    aside {
      width: 260px;
      background: linear-gradient(180deg, #0c0c0c 0%, #060606 100%);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    aside::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .brand {
      padding: 1.5rem 1.25rem 1.25rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .brand img {
      width: 88px;
      height: 88px;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,.6), 0 0 0 1px var(--border-strong);
      margin-bottom: 0.85rem;
    }
    .brand h1 {
      font-family: Cinzel, serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--gold-light);
      text-transform: uppercase;
    }
    .brand p {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.35rem;
    }
    .copilot-tag {
      display: inline-block;
      margin-top: 0.65rem;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--gold);
      background: rgba(201,162,39,.06);
    }
    nav { flex: 1; padding: 0.75rem 0; overflow-y: auto; }
    nav button {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      text-align: left;
      padding: 0.65rem 1.25rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 2px solid transparent;
    }
    nav button:hover {
      color: var(--text);
      background: rgba(201,162,39,.04);
      border-left-color: var(--gold-dim);
    }
    nav button.active {
      color: var(--gold-light);
      background: linear-gradient(90deg, rgba(201,162,39,.12), transparent);
      border-left-color: var(--gold);
    }
    .aside-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .live-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      margin-right: 0.35rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      background: rgba(10,10,10,.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h2 {
      font-family: Cinzel, serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.06em;
    }
    .header-sub { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
    .badge {
      font-size: 0.62rem;
      padding: 0.3rem 0.65rem;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-ok { background: rgba(74,222,128,.1); color: var(--green); border-color: rgba(74,222,128,.3); }
    .badge-warn { background: rgba(251,191,36,.1); color: var(--amber); border-color: rgba(251,191,36,.3); }
    .badge-err { background: rgba(248,113,113,.1); color: var(--red); border-color: rgba(248,113,113,.3); }
    .badge-gold { background: rgba(201,162,39,.12); color: var(--gold-light); border-color: var(--border-strong); }
    .content { padding: 1.75rem 2rem 2.5rem; max-width: 1200px; width: 100%; }
    .section { display: none; animation: fadeIn 0.35s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .hero {
      background: linear-gradient(135deg, rgba(201,162,39,.08) 0%, rgba(17,17,17,.9) 50%, var(--panel) 100%);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: "";
      position: absolute;
      top: -50%; right: -10%;
      width: 200px; height: 200px;
      background: radial-gradient(circle, var(--gold-glow), transparent 70%);
      pointer-events: none;
    }
    .hero-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .hero-title {
      font-family: Cinzel, serif;
      font-size: 1.35rem;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .hero-meta { font-size: 0.78rem; color: var(--muted); }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 1rem; right: 1rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }
    .card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    .card h3 {
      font-size: 0.62rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.12em;
      margin-bottom: 0.45rem;
    }
    .card .val {
      font-size: 1.35rem;
      font-weight: 600;
      font-family: "DM Sans", monospace;
      color: var(--gold-light);
    }
    .block {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .block h3 {
      font-family: Cinzel, serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .svc, .row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid rgba(201,162,39,.08);
      font-size: 0.82rem;
    }
    .svc:last-child, .row:last-child { border-bottom: none; }
    .svc span:first-child, .row strong { color: var(--text); }
    .muted { color: var(--muted); font-size: 0.75rem; }
    .agent {
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(201,162,39,.08);
    }
    .agent:last-child { border-bottom: none; }
    .agent-name { font-weight: 600; font-size: 0.85rem; color: var(--gold-light); }
    .tag {
      display: inline-block;
      font-size: 0.58rem;
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
      background: rgba(201,162,39,.1);
      color: var(--gold);
      border: 1px solid var(--border);
      margin-left: 0.4rem;
      letter-spacing: 0.04em;
    }
    #status { margin-left: auto; font-size: 0.68rem; color: var(--muted); letter-spacing: 0.04em; }
    .links { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; padding-top: 1rem; border-top: 1px solid var(--border); }
    .links a {
      color: var(--gold);
      font-size: 0.72rem;
      text-decoration: none;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .links a:hover { color: var(--gold-light); }
    .prose {
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      white-space: pre-wrap;
      max-height: 280px;
      overflow-y: auto;
    }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; }
      nav { display: flex; flex-wrap: wrap; padding: 0.5rem; }
      nav button { width: auto; flex: 1; min-width: 120px; border-left: none; border-bottom: 2px solid transparent; }
      nav button.active { border-bottom-color: var(--gold); border-left: none; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <img src="/mission-control/logo" alt="Bilshenz Strategy" />
      <h1>Jimplas Capital</h1>
      <p>BSv3.2 Platform</p>
      <span class="copilot-tag">CEO Copilot</span>
    </div>
    <nav id="nav"></nav>
    <div class="aside-footer">
      <span class="live-dot"></span>Observer Mode · Read Only
    </div>
  </aside>
  <div class="main">
    <header>
      <div>
        <h2 id="page-title">Command Overview</h2>
        <div class="header-sub">Executive intelligence · Bilshenz Strategy v3.2</div>
      </div>
      <span id="bsv32-badge" class="badge badge-gold">Loading…</span>
      <span id="regime-badge" class="badge badge-gold">—</span>
      <span id="status">—</span>
    </header>
    <div class="content">
      <div id="overview" class="section active"></div>
      <div id="executive" class="section"></div>
      <div id="regime" class="section"></div>
      <div id="infrastructure" class="section"></div>
      <div id="analytics" class="section"></div>
      <div id="marketing" class="section"></div>
      <div id="agents" class="section"></div>
      <div id="alerts" class="section"></div>
      <div class="links">
        <a href="/docs">API Docs</a>
        <a href="/health">System Health</a>
        <a href="/agents/registry">Agent Registry</a>
      </div>
    </div>
  </div>
  <script>
    const SECTIONS = [
      ["overview", "Command Overview"],
      ["executive", "Executive Briefing"],
      ["regime", "Market Regime"],
      ["infrastructure", "Infrastructure"],
      ["analytics", "Quant Analytics"],
      ["marketing", "Marketing Intel"],
      ["agents", "Agent Network"],
      ["alerts", "Alerts & Research"],
    ];
    const $ = (id) => document.getElementById(id);
    const fmt = (n, d = 2) => (n == null || n === "" ? "—" : Number(n).toFixed(d));
    const badge = (ok, label) => `<span class="badge ${ok ? "badge-ok" : "badge-err"}">${label}</span>`;
    const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;");

    SECTIONS.forEach(([id, label]) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.dataset.section = id;
      b.onclick = () => show(id, label);
      $("nav").appendChild(b);
    });

    function show(id, label) {
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
      $(id).classList.add("active");
      document.querySelector(`nav button[data-section="${id}"]`)?.classList.add("active");
      $("page-title").textContent = label;
    }

    async function get(path) {
      const r = await fetch(path);
      if (!r.ok) throw new Error(path + " " + r.status);
      return r.json();
    }

    function cards(items) {
      return `<div class="grid">${items.map(([l,v,c]) =>
        `<div class="card"><h3>${l}</h3><div class="val" style="color:${c||"var(--gold-light)"}">${esc(v)}</div></div>`
      ).join("")}</div>`;
    }

    function hero(title, meta) {
      return `<div class="hero"><div class="hero-label">CEO Copilot</div><div class="hero-title">${title}</div><div class="hero-meta">${meta}</div></div>`;
    }

    async function load() {
      try {
        const [ov, briefing, infra, risk, perf, execQ, mktStats, mktQueue, mktTrends, alerts, research, registry] = await Promise.all([
          get("/dashboard/overview"),
          get("/dashboard/briefing").catch(() => null),
          get("/dashboard/infrastructure"),
          get("/dashboard/risk").catch(() => null),
          get("/dashboard/performance").catch(() => null),
          get("/dashboard/execution-quality").catch(() => null),
          get("/marketing/stats").catch(() => null),
          get("/marketing/queue?status=draft&limit=8").catch(() => []),
          get("/marketing/trends?limit=8").catch(() => []),
          get("/dashboard/alerts?limit=15").catch(() => []),
          get("/dashboard/research?status=pending").catch(() => []),
          get("/agents/registry"),
        ]);

        $("bsv32-badge").textContent = `BSv3.2 ${ov.bsv32_status || "unknown"}`;
        $("bsv32-badge").className = "badge " + (ov.system_running ? "badge-ok" : "badge-warn");
        $("regime-badge").textContent = `${ov.market_regime || "unknown"} regime`;
        $("regime-badge").className = "badge badge-gold";

        $("overview").innerHTML = hero("Mission Control Snapshot", "Real-time supervisory intelligence across the BSv3.2 stack") + cards([
          ["Live P&L", "$" + fmt(ov.live_pnl), ov.live_pnl >= 0 ? "var(--green)" : "var(--red)"],
          ["Daily P&L", "$" + fmt(ov.daily_pnl)],
          ["Open Positions", ov.open_positions ?? 0],
          ["Risk Score", fmt(ov.risk_score, 1)],
          ["Infra Health", fmt(ov.infra_health_score, 0) + "%"],
          ["Active Alerts", ov.active_alerts ?? 0],
          ["Pending Reviews", ov.pending_reviews ?? 0],
          ["MT5 Bridge", ov.mt5_connected ? "Online" : "Offline", ov.mt5_connected ? "var(--green)" : "var(--red)"],
        ]);

        if (briefing) {
          const b = briefing;
          const perfBase = b.performance_vs_baseline || {};
          $("executive").innerHTML = hero(`Executive Briefing · ${esc(b.briefing_date)}`, `Generated ${esc(b.generated_at?.slice(0,19))} UTC`) + `
            <div class="block"><h3>Financial Position</h3>
              ${cards([
                ["Live P&L", "$"+fmt(b.pnl?.live_pnl), (b.pnl?.live_pnl||0)>=0?"var(--green)":"var(--red)"],
                ["Daily P&L", "$"+fmt(b.pnl?.daily_pnl)],
                ["Account Equity", "$"+fmt(b.pnl?.account_equity)],
                ["Risk Score", fmt(b.risk?.risk_score,1)],
                ["Drawdown", fmt(b.risk?.drawdown_pct,1)+"%"],
                ["Infra Score", fmt(b.infrastructure?.health_score,0)+"%"],
              ])}
            </div>
            <div class="block"><h3>Pending Executive Decisions</h3>
              ${(b.pending_human_decisions||[]).map(d => `<div class="row"><div><strong>${esc(d.title)}</strong><br><span class="muted">${esc(d.finding_type)}</span></div>${badge(false,d.severity||"review")}</div>`).join("") || `<p class="muted">No items requiring your decision</p>`}
            </div>`;
          $("regime").innerHTML = hero("Market Regime Analysis", "BSv3.2 regime classification and baseline performance") + `
            <div class="block"><h3>Current Regime</h3>
              ${cards([
                ["Regime", esc(b.bsv32_system?.market_regime || ov.market_regime)],
                ["NFP Blackout", b.bsv32_system?.nfp_blackout ? "ACTIVE" : "Clear", b.bsv32_system?.nfp_blackout ? "var(--amber)" : "var(--green)"],
                ["System Status", esc(b.bsv32_system?.status)],
                ["Win Rate", perfBase.win_rate != null ? (perfBase.win_rate*100).toFixed(1)+"%" : (perf?.win_rate != null ? (perf.win_rate*100).toFixed(1)+"%" : "—")],
              ])}
            </div>
            <div class="block"><h3>Performance vs Baseline</h3>
              ${cards([
                ["Expectancy", fmt(perfBase.expectancy ?? perf?.expectancy)],
                ["Edge Decay", fmt(perfBase.edge_decay_score ?? perf?.edge_decay_score, 2)],
                ["Anomalies", (perfBase.anomaly_flags||perf?.anomaly_flags||[]).length || 0],
              ])}
              ${(perfBase.anomaly_flags||[]).length ? `<p class="muted" style="margin-top:.75rem">${esc(perfBase.anomaly_flags.join(", "))}</p>` : ""}
            </div>`;
        } else {
          $("executive").innerHTML = hero("Executive Briefing", "Awaiting CEO Copilot data") + `<div class="block"><p class="muted">Briefing will populate on next agent cycle</p></div>`;
          $("regime").innerHTML = hero("Market Regime", esc(ov.market_regime || "unknown"));
        }

        const svc = infra.current?.services || {};
        const v = infra.current?.vps || {};
        $("infrastructure").innerHTML = hero("Infrastructure Command", "VPS, APIs, and execution layer health") + `
          <div style="margin-bottom:1rem">${badge(infra.current?.healthy, infra.current?.healthy ? "All Systems Operational" : "Degraded")}</div>
          <div class="block"><h3>Service Endpoints</h3>
            ${Object.entries(svc).map(([n,s]) =>
              `<div class="svc"><span>${esc(n.replace(/_/g," "))}</span>${badge(s.ok, s.ok ? (s.latency_ms+"ms") : "DOWN")}</div>`
            ).join("")}
          </div>
          <div class="block"><h3>VPS Resources</h3>
            ${cards([["CPU", fmt(v.cpu_pct,1)+"%"], ["RAM", fmt(v.ram_pct,1)+"%"], ["Disk", fmt(v.disk_pct,1)+"%"]])}
          </div>`;

        $("analytics").innerHTML = hero("Quant Analytics", "Performance intelligence and execution quality") + `
          <div class="block"><h3>Performance Intelligence</h3>
            ${perf ? cards([
              ["Trades Today", perf.total_trades ?? 0],
              ["Win Rate", perf.win_rate != null ? (perf.win_rate*100).toFixed(1)+"%" : "—"],
              ["Expectancy", fmt(perf.expectancy)],
              ["Total P&L", "$"+fmt(perf.total_pnl_usd)],
              ["Edge Decay", fmt(perf.edge_decay_score, 2)],
            ]) : `<p class="muted">Daily report generates on performance_intel schedule</p>`}
          </div>
          <div class="block"><h3>Execution Quality</h3>
            ${execQ ? `<div class="prose">${esc(JSON.stringify(execQ, null, 2))}</div>` : `<p class="muted">Awaiting trade execution data</p>`}
          </div>
          ${risk ? `<div class="block"><h3>Risk Orchestrator</h3>${cards([
            ["Risk Score", fmt(risk.risk_score,1)],
            ["Drawdown", fmt(risk.account_drawdown_pct,1)+"%"],
            ["Lot Scaling", fmt(risk.lot_scaling_factor,2)],
            ["Kill Switch", risk.kill_switch_recommended ? "RECOMMENDED" : "Clear", risk.kill_switch_recommended ? "var(--red)" : "var(--green)"],
          ])}</div>` : ""}`;

        $("marketing").innerHTML = hero("Marketing Intelligence", "Brand content pipeline and trend signals") + `
          <div class="block"><h3>Content Pipeline</h3>
            ${mktStats ? cards([
              ["Drafts", mktStats.draft_count ?? 0],
              ["Approved", mktStats.approved_count ?? 0],
            ]) : `<p class="muted">Marketing agent loading…</p>`}
          </div>
          <div class="block"><h3>Content Queue</h3>
            ${(mktQueue||[]).map(i => `<div class="row"><div><strong>${esc(i.title||i.platform)}</strong><br><span class="muted">${esc(i.platform)} · ${esc(i.pillar||"")}</span></div></div>`).join("") || `<p class="muted">No drafts in queue</p>`}
          </div>
          <div class="block"><h3>Trend Signals</h3>
            ${(mktTrends||[]).map(t => `<div class="row"><div>${esc(t.topic)}<br><span class="muted">${esc(t.suggested_angle||"")}</span></div><span class="muted">${fmt(t.relevance_score,2)}</span></div>`).join("") || `<p class="muted">No trends detected yet</p>`}
          </div>`;

        $("agents").innerHTML = hero("Agent Network", `${registry.count} supervisory agents · read-only observer mode`) + `
          <div class="block"><h3>Registered Agents</h3>
            ${(registry.agents||[]).map(a => `
              <div class="agent">
                <span class="agent-name">${esc(a.name.replace(/_/g," "))}</span><span class="tag">${esc(a.interval_label)}</span>
                <div class="muted" style="margin-top:.35rem">${esc(a.description)}</div>
              </div>`).join("")}
          </div>`;

        $("alerts").innerHTML = hero("Alerts & Research", "System alerts and quant research queue") + `
          <div class="block"><h3>Active Alerts (${(alerts||[]).length})</h3>
            ${(alerts||[]).map(a => `<div class="row"><div><strong>${esc(a.title)}</strong><br><span class="muted">${esc(a.severity)} · ${esc(a.created_at?.slice(0,19))}</span></div></div>`).join("") || `<p class="muted">No active alerts</p>`}
          </div>
          <div class="block"><h3>Research Queue (${(research||[]).length})</h3>
            ${(research||[]).map(r => `<div class="row"><div><strong>${esc(r.title)}</strong><br><span class="muted">${esc(r.finding_type)} · ${esc(r.severity)}</span></div></div>`).join("") || `<p class="muted">No pending research</p>`}
          </div>`;

        $("status").textContent = "Sync " + new Date().toLocaleTimeString();
      } catch (e) {
        $("status").textContent = "Error: " + e.message;
      }
    }
    show("overview", "Command Overview");
    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
