<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JCM CEO Copilot — BSv3.2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #050505;
      --black-soft: #0a0a0a;
      --panel: #111111;
      --panel-hover: #161616;
      --gold: #c9a227;
      --gold-light: #e8c547;
      --gold-dim: #8a7020;
      --gold-glow: rgba(201, 162, 39, 0.25);
      --text: #f5f0e6;
      --muted: #9a9080;
      --border: rgba(201, 162, 39, 0.22);
      --border-strong: rgba(201, 162, 39, 0.45);
      --green: #4ade80;
      --red: #f87171;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201,162,39,.08), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(201,162,39,.04), transparent);
    }
    aside {
      width: 260px;
      background: linear-gradient(180deg, #0c0c0c 0%, #060606 100%);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    aside::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .brand {
      padding: 1.5rem 1.25rem 1.25rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .brand img {
      width: 88px;
      height: 88px;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,.6), 0 0 0 1px var(--border-strong);
      margin-bottom: 0.85rem;
    }
    .brand h1 {
      font-family: Cinzel, serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--gold-light);
      text-transform: uppercase;
    }
    .brand p {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.35rem;
    }
    .copilot-tag {
      display: inline-block;
      margin-top: 0.65rem;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--gold);
      background: rgba(201,162,39,.06);
    }
    nav { flex: 1; padding: 0.75rem 0; overflow-y: auto; }
    nav button {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      text-align: left;
      padding: 0.65rem 1.25rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 2px solid transparent;
    }
    nav button:hover {
      color: var(--text);
      background: rgba(201,162,39,.04);
      border-left-color: var(--gold-dim);
    }
    nav button.active {
      color: var(--gold-light);
      background: linear-gradient(90deg, rgba(201,162,39,.12), transparent);
      border-left-color: var(--gold);
    }
    .aside-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .live-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      margin-right: 0.35rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      background: rgba(10,10,10,.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h2 {
      font-family: Cinzel, serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.06em;
    }
    .header-sub { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
    .badge {
      font-size: 0.62rem;
      padding: 0.3rem 0.65rem;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-ok { background: rgba(74,222,128,.1); color: var(--green); border-color: rgba(74,222,128,.3); }
    .badge-warn { background: rgba(251,191,36,.1); color: var(--amber); border-color: rgba(251,191,36,.3); }
    .badge-err { background: rgba(248,113,113,.1); color: var(--red); border-color: rgba(248,113,113,.3); }
    .badge-gold { background: rgba(201,162,39,.12); color: var(--gold-light); border-color: var(--border-strong); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 0.5rem; }
    .data-table th, .data-table td { border: 1px solid var(--border); padding: 0.45rem 0.6rem; text-align: left; }
    .data-table th { color: var(--gold-light); font-weight: 600; }
    .briefing-agent { margin-bottom: 1rem; }
    .content { padding: 1.75rem 2rem 2.5rem; max-width: 1200px; width: 100%; }
    .section { display: none; animation: fadeIn 0.35s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .hero {
      background: linear-gradient(135deg, rgba(201,162,39,.08) 0%, rgba(17,17,17,.9) 50%, var(--panel) 100%);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: "";
      position: absolute;
      top: -50%; right: -10%;
      width: 200px; height: 200px;
      background: radial-gradient(circle, var(--gold-glow), transparent 70%);
      pointer-events: none;
    }
    .hero-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .hero-title {
      font-family: Cinzel, serif;
      font-size: 1.35rem;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .hero-meta { font-size: 0.78rem; color: var(--muted); }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 1rem; right: 1rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }
    .card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    .card h3 {
      font-size: 0.62rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.12em;
      margin-bottom: 0.45rem;
    }
    .card .val {
      font-size: 1.35rem;
      font-weight: 600;
      font-family: "DM Sans", monospace;
      color: var(--gold-light);
    }
    .card .val-regime {
      font-size: clamp(0.9rem, 2.2vw, 1.15rem);
      line-height: 1.3;
      word-break: break-word;
      overflow-wrap: anywhere;
      hyphens: auto;
      max-width: 100%;
    }
    .card-regime {
      grid-column: 1 / -1;
      min-width: 0;
    }
    @media (min-width: 640px) {
      .card-regime { grid-column: span 2; }
    }
    .block {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .block h3 {
      font-family: Cinzel, serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .svc, .row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid rgba(201,162,39,.08);
      font-size: 0.82rem;
    }
    .svc:last-child, .row:last-child { border-bottom: none; }
    .svc span:first-child, .row strong { color: var(--text); }
    .muted { color: var(--muted); font-size: 0.75rem; }
    .agent {
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(201,162,39,.08);
    }
    .agent:last-child { border-bottom: none; }
    .agent-name { font-weight: 600; font-size: 0.85rem; color: var(--gold-light); }
    .tag {
      display: inline-block;
      font-size: 0.58rem;
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
      background: rgba(201,162,39,.1);
      color: var(--gold);
      border: 1px solid var(--border);
      margin-left: 0.4rem;
      letter-spacing: 0.04em;
    }
    #status { margin-left: auto; font-size: 0.68rem; color: var(--muted); letter-spacing: 0.04em; }
    .links { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; padding-top: 1rem; border-top: 1px solid var(--border); }
    .links a {
      color: var(--gold);
      font-size: 0.72rem;
      text-decoration: none;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .links a:hover { color: var(--gold-light); }
    .prose {
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      white-space: pre-wrap;
      max-height: 280px;
      overflow-y: auto;
    }
    .trade-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .trade-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.62rem;
      padding: 0.5rem 0.35rem;
      border-bottom: 1px solid var(--border);
    }
    .trade-table td {
      padding: 0.55rem 0.35rem;
      border-bottom: 1px solid rgba(201,162,39,.06);
      vertical-align: middle;
    }
    .outcome-win { color: var(--green); font-weight: 600; }
    .outcome-loss { color: var(--red); font-weight: 600; }
    .outcome-open { color: var(--amber); font-weight: 600; }
    .outcome-be { color: var(--muted); font-weight: 600; }
    .clickable {
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .clickable:hover { background: rgba(201,162,39,.06); }
    .read-hint {
      font-size: 0.62rem;
      color: var(--gold-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .modal-backdrop.open { display: flex; }
    .login-gate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(5,5,5,.92);
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 1.75rem;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .login-card h2 {
      font-family: Cinzel, serif;
      color: var(--gold-light);
      font-size: 1.1rem;
      margin-bottom: 0.35rem;
    }
    .login-card input {
      width: 100%;
      margin-top: 0.65rem;
      padding: 0.65rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--black-soft);
      color: var(--text);
      font-size: 0.9rem;
    }
    .login-card button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.7rem;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: #050505;
      font-weight: 600;
      cursor: pointer;
    }
    .login-err { color: var(--red); margin-top: 0.65rem; font-size: 0.82rem; }
    .loading-pulse {
      color: var(--muted);
      font-size: 0.85rem;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      max-width: 720px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
    }
    .modal-header {
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .modal-header h2 {
      font-family: Cinzel, serif;
      font-size: 1.05rem;
      color: var(--gold-light);
      line-height: 1.35;
    }
    .modal-meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }
    .modal-close {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      width: 2rem;
      height: 2rem;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .modal-close:hover { color: var(--gold-light); border-color: var(--border-strong); }
    .modal-body {
      padding: 1.25rem 1.5rem 1.5rem;
      overflow-y: auto;
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
    }
    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .modal-tags span {
      font-size: 0.68rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(201,162,39,.08);
      color: var(--gold);
      border: 1px solid var(--border);
    }
    .alloc-bar-wrap {
      background: rgba(201,162,39,.08);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.15rem;
      margin-bottom: 1rem;
    }
    .alloc-bar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.65rem;
    }
    .alloc-bar-track {
      height: 10px;
      background: rgba(0,0,0,.35);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .alloc-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold-light));
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .alloc-gate {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid rgba(201,162,39,.1);
      font-size: 0.82rem;
    }
    .alloc-gate:last-child { border-bottom: none; }
    .alloc-gate-pass { color: var(--green); }
    .alloc-gate-fail { color: var(--red); }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; }
      nav { display: flex; flex-wrap: wrap; padding: 0.5rem; }
      nav button { width: auto; flex: 1; min-width: 120px; border-left: none; border-bottom: 2px solid transparent; }
      nav button.active { border-bottom-color: var(--gold); border-left: none; }
    }
  </style>
</head>
<body>
  <div id="login-gate" class="login-gate">
    <div class="login-card">
      <h2>JCM Mission Control</h2>
      <p class="muted">Sign in with your owner credentials</p>
      <input id="login-user" type="email" autocomplete="username" placeholder="Email" />
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="Password" />
      <button type="button" id="login-btn">Sign in</button>
      <p id="login-err" class="login-err" style="display:none"></p>
    </div>
  </div>
  <aside>
    <div class="brand">
      <img src="/mission-control/logo" alt="Bilshenz Strategy" />
      <h1>Jimplas Capital</h1>
      <p>BSv3.2 Platform</p>
      <span class="copilot-tag">CEO Copilot</span>
    </div>
    <nav id="nav"></nav>
    <div class="aside-footer">
      <span class="live-dot"></span>Observer Mode · Read Only
    </div>
  </aside>
  <div class="main">
    <header>
      <div>
        <h2 id="page-title">Command Overview</h2>
        <div class="header-sub">Executive intelligence · Bilshenz Strategy v3.2</div>
      </div>
      <span id="bsv32-badge" class="badge badge-gold">Loading…</span>
      <span id="regime-badge" class="badge badge-gold">—</span>
      <span id="status">—</span>
    </header>
    <div class="content">
      <div id="overview" class="section active"><p class="muted">Loading mission data…</p></div>
      <div id="executive" class="section"></div>
      <div id="regime" class="section"></div>
      <div id="infrastructure" class="section"></div>
      <div id="allocator" class="section"></div>
      <div id="analytics" class="section"></div>
      <div id="marketing" class="section"></div>
      <div id="agents" class="section"></div>
      <div id="alerts" class="section"></div>
      <div class="links">
        <a href="/docs">API Docs</a>
        <a href="/health">System Health</a>
        <a href="/agents/registry">Agent Registry</a>
      </div>
    </div>
  </div>
  <div id="reader-modal" class="modal-backdrop" onclick="if(event.target===this) closeReader()">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div>
          <h2 id="reader-title">—</h2>
          <div id="reader-meta" class="modal-meta"></div>
        </div>
        <button class="modal-close" type="button" onclick="closeReader()" aria-label="Close">&times;</button>
      </div>
      <div id="reader-body" class="modal-body"></div>
      <div id="reader-tags" class="modal-tags" style="padding:0 1.5rem 1.25rem;display:none"></div>
    </div>
  </div>
  <script>
    const SECTIONS = [
      ["overview", "Command Overview"],
      ["executive", "Executive Briefing"],
      ["allocator", "Allocator Progress"],
      ["regime", "Market Regime"],
      ["infrastructure", "Infrastructure"],
      ["analytics", "Quant Analytics"],
      ["marketing", "Marketing Intel"],
      ["agents", "Agent Network"],
      ["alerts", "Alerts & Research"],
    ];
    const $ = (id) => document.getElementById(id);
    const fmt = (n, d = 2) => (n == null || n === "" ? "—" : Number(n).toFixed(d));
    const badge = (ok, label) => `<span class="badge ${ok ? "badge-ok" : "badge-err"}">${label}</span>`;
    const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;");

    SECTIONS.forEach(([id, label]) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.dataset.section = id;
      b.onclick = () => show(id, label);
      $("nav").appendChild(b);
    });

    function show(id, label) {
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
      $(id).classList.add("active");
      document.querySelector(`nav button[data-section="${id}"]`)?.classList.add("active");
      $("page-title").textContent = label;
    }

    const MC_AUTH_KEY = "mcBasicAuth";

    function getMcAuth() {
      return sessionStorage.getItem(MC_AUTH_KEY);
    }

    function setMcAuth(user, pass) {
      const token = btoa(`${user}:${pass}`);
      sessionStorage.setItem(MC_AUTH_KEY, token);
      return token;
    }

    function clearMcAuth() {
      sessionStorage.removeItem(MC_AUTH_KEY);
    }

    function showLoginGate(message) {
      const gate = $("login-gate");
      const err = $("login-err");
      gate.style.display = "flex";
      if (message) {
        err.textContent = message;
        err.style.display = "block";
      } else {
        err.style.display = "none";
      }
    }

    function hideLoginGate() {
      $("login-gate").style.display = "none";
    }

    async function get(path, timeoutMs = 20000) {
      const headers = {};
      const auth = getMcAuth();
      if (auth) headers.Authorization = `Basic ${auth}`;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const r = await fetch(path, { credentials: "include", headers, signal: ctrl.signal });
        if (r.status === 401) {
          clearMcAuth();
          throw new Error("login_required");
        }
        if (!r.ok) throw new Error(path + " " + r.status);
        return r.json();
      } finally {
        clearTimeout(timer);
      }
    }

    function loadingBlock(label) {
      return `<div class="block"><p class="loading-pulse">${esc(label)}</p></div>`;
    }

    let latestOverview = null;
    let liveTickInFlight = false;
    let missionWs = null;
    let mcWsToken = null;
    const LIVE_POLL_MS = 5000;
    let wsTickDebounce = null;

    function scheduleLiveTick() {
      if (wsTickDebounce) clearTimeout(wsTickDebounce);
      wsTickDebounce = setTimeout(() => refreshLiveTick(), 2000);
    }

    function overviewMetricCards(ov) {
      const src = ov.data_source === "mt5_live" ? "MT5 live" : "DB snapshot";
      return [
        ["live_pnl", "Live P&L", "$" + fmt(ov.live_pnl), ov.live_pnl >= 0 ? "var(--green)" : "var(--red)"],
        ["daily_pnl", "Daily P&L", "$" + fmt(ov.daily_pnl), (ov.daily_pnl || 0) >= 0 ? "var(--green)" : "var(--red)"],
        ["open_positions", "Open Positions", String(ov.open_positions ?? 0)],
        ["account_equity", "Account Equity", ov.account_equity != null ? "$" + fmt(ov.account_equity) : "—"],
        ["risk_score", "Risk Score", fmt(ov.risk_score, 1)],
        ["infra_health", "Infra Health", fmt((ov.infra_health_score || 0) * 100, 0) + "%"],
        ["active_alerts", "Active Alerts", String(ov.active_alerts ?? 0)],
        ["pending_reviews", "Pending Reviews", String(ov.pending_reviews ?? 0)],
        ["mt5_bridge", "MT5 Bridge", ov.mt5_connected ? "Online" : "Offline", ov.mt5_connected ? "var(--green)" : "var(--red)"],

      ];
    }

    function metricCardsHtml(items) {
      return `<div class="grid">${items.map(([key, label, val, color, extraClass]) => {
        const cardCls = ["card", extraClass || ""].filter(Boolean).join(" ");
        const valCls = key === "regime" ? "val val-regime" : "val";
        return `<div class="${cardCls}" data-metric="${key}"><h3>${esc(label)}</h3><div class="${valCls}" style="color:${color || "var(--gold-light)"}">${val}</div></div>`;
      }).join("")}</div>`;
    }

    function openPositionsBlock(ov) {
      const pos = ov.positions || [];
      if (!pos.length) {
        return `<div class="block" id="live-positions-block"><h3>Open Positions (MT5)</h3><p class="muted">No open positions</p></div>`;
      }
      const rows = pos.map((p) => `<tr>
        <td>${esc(p.symbol)}</td>
        <td>${esc(p.type)}</td>
        <td>${fmt(p.volume, 2)}</td>
        <td>${fmt(p.price_open)}</td>
        <td style="color:${(p.profit||0)>=0?"var(--green)":"var(--red)"}">$${fmt(p.profit)}</td>
      </tr>`).join("");
      return `<div class="block" id="live-positions-block"><h3>Open Positions (MT5 live)</h3>
        <table class="data-table"><thead><tr><th>Symbol</th><th>Side</th><th>Lots</th><th>Entry</th><th>P&L</th></tr></thead>
        <tbody id="live-positions-body">${rows}</tbody></table></div>`;
    }

    function updateOverviewLiveValues(ov) {
      const colorMap = {
        live_pnl: (ov.live_pnl || 0) >= 0 ? "var(--green)" : "var(--red)",
        daily_pnl: (ov.daily_pnl || 0) >= 0 ? "var(--green)" : "var(--red)",
        mt5_bridge: ov.mt5_connected ? "var(--green)" : "var(--red)",
      };
      const values = {
        live_pnl: "$" + fmt(ov.live_pnl),
        daily_pnl: "$" + fmt(ov.daily_pnl),
        open_positions: String(ov.open_positions ?? 0),
        account_equity: ov.account_equity != null ? "$" + fmt(ov.account_equity) : "—",
        risk_score: fmt(ov.risk_score, 1),
        infra_health: fmt((ov.infra_health_score || 0) * 100, 0) + "%",
        active_alerts: String(ov.active_alerts ?? 0),
        pending_reviews: String(ov.pending_reviews ?? 0),
        mt5_bridge: ov.mt5_connected ? "Online" : "Offline",
        data_source: ov.data_source === "mt5_live" ? "MT5 live" : "DB snapshot",
      };
      Object.entries(values).forEach(([key, text]) => {
        const el = document.querySelector(`[data-metric="${key}"] .val`);
        if (el) {
          el.textContent = text;
          if (colorMap[key]) el.style.color = colorMap[key];
        }
      });
      const tbody = $("live-positions-body");
      if (tbody && (ov.positions || []).length) {
        tbody.innerHTML = (ov.positions || []).map((p) => `<tr>
          <td>${esc(p.symbol)}</td><td>${esc(p.type)}</td><td>${fmt(p.volume, 2)}</td>
          <td>${fmt(p.price_open)}</td>
          <td style="color:${(p.profit||0)>=0?"var(--green)":"var(--red)"}">$${fmt(p.profit)}</td>
        </tr>`).join("");
      }
    }

    function paintOverviewHeader(ov) {
      $("bsv32-badge").textContent = `BSv3.2 ${ov.bsv32_status || "unknown"}`;
      $("bsv32-badge").className = "badge " + (ov.system_running ? "badge-ok" : "badge-warn");
      $("regime-badge").textContent = `${formatRegimeLabel(ov.market_regime)} regime`;
      $("regime-badge").className = "badge badge-gold";
    }

    function paintOverview(ov, opts = {}) {
      const initial = opts.initial !== false;
      latestOverview = ov;
      paintOverviewHeader(ov);
      if (initial || !$("overview").dataset.liveReady) {
        const sub = ov.data_source === "mt5_live"
          ? "MT5-connected live P&L · refreshes every 5s"
          : "Supervisory intelligence across the BSv3.2 stack";
        $("overview").innerHTML = hero("Mission Control Snapshot", sub)
          + (window.__allocator ? renderAllocatorStrip(window.__allocator) : "")
          + metricCardsHtml(overviewMetricCards(ov))
          + openPositionsBlock(ov);
        $("overview").dataset.liveReady = "1";
      } else {
        updateOverviewLiveValues(ov);
      }
    }

    async function refreshLiveTick() {
      if (liveTickInFlight || document.hidden || !getMcAuth()) return;
      liveTickInFlight = true;
      try {
        const ov = await get("/dashboard/live-tick", 8000);
        paintOverview(ov, { initial: false });
        const ts = ov.last_updated ? new Date(ov.last_updated).toLocaleTimeString() : new Date().toLocaleTimeString();
        const liveTag = ov.data_source === "mt5_live" ? "MT5 live" : "cached";
        $("status").textContent = `${liveTag} · ${ts}`;
      } catch (e) {
        if (e.message !== "login_required") {
          $("status").textContent = "Live tick paused";
        }
      } finally {
        liveTickInFlight = false;
      }
    }

    async function fetchWsToken() {
      const auth = getMcAuth();
      if (!auth) return null;
      try {
        const r = await fetch("/mission-control/ws-token", {
          method: "POST",
          credentials: "include",
          headers: { Authorization: `Basic ${auth}` },
        });
        if (!r.ok) return null;
        const j = await r.json();
        return j.token || null;
      } catch (_) {
        return null;
      }
    }

    async function connectMissionWs() {
      if (missionWs && (missionWs.readyState === WebSocket.OPEN || missionWs.readyState === WebSocket.CONNECTING)) {
        return;
      }
      if (!mcWsToken && getMcAuth()) {
        mcWsToken = await fetchWsToken();
      }
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const qs = mcWsToken ? `?token=${encodeURIComponent(mcWsToken)}` : "";
      missionWs = new WebSocket(`${proto}//${location.host}/ws${qs}`);
      missionWs.onmessage = () => { scheduleLiveTick(); };
      missionWs.onclose = (ev) => {
        missionWs = null;
        if (ev.code === 1008) mcWsToken = null;
        setTimeout(connectMissionWs, 5000);
      };
    }

    function paintAgents(registry, health, audit) {
      const hm = {};
      (health?.agents || []).forEach((h) => { hm[h.name] = h; });
      const auditRows = (audit?.items || []).slice(0, 20).map((e) => `<tr>
        <td>${esc((e.at || "").slice(0, 19))}</td>
        <td>${esc(e.agent || "")}</td>
        <td>${esc(e.action || "")}</td>
        <td>${esc(e.priority || "")}</td>
      </tr>`).join("");
      const auditBlock = auditRows
        ? `<div class="block"><h3>Action audit (orchestrator)</h3>
          <table class="data-table"><thead><tr><th>Time (UTC)</th><th>Agent</th><th>Action</th><th>Priority</th></tr></thead>
          <tbody>${auditRows}</tbody></table></div>`
        : `<div class="block"><h3>Action audit</h3><p class="muted">No orchestrator actions logged yet</p></div>`;
      $("agents").innerHTML = hero("Agent Network", `${registry.count} agents · institutional health monitoring`) + `
        <div class="block"><h3>Registered Agents</h3>
          ${(registry.agents||[]).map(a => {
            const h = hm[a.name] || {};
            const score = h.health_score != null ? h.health_score : "—";
            const st = h.status || "unknown";
            const color = st === "healthy" ? "var(--green)" : st === "degraded" ? "var(--amber)" : "var(--muted)";
            const issues = (h.validation_issues || []).length ? ` · ${h.validation_issues.length} flag(s)` : "";
            return `
            <div class="agent">
              <span class="agent-name">${esc(a.name.replace(/_/g," "))}</span>
              <span class="tag">${esc(a.interval_label)}</span>
              <span class="tag" style="color:${color}">${esc(st)} · ${score}${esc(issues)}</span>
              <div class="muted" style="margin-top:.35rem">${esc(a.description)}</div>
            </div>`;
          }).join("")}
        </div>${auditBlock}`;
    }

    function formatRegimeLabel(regime) {
      const r = String(regime || "unknown").trim();
      if (!r || r === "unknown") return "Unknown";
      return r.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function cards(items) {
      return `<div class="grid">${items.map(([l, v, c, extraClass]) => {
        const isRegime = l === "Regime";
        const cardCls = ["card", extraClass || (isRegime ? "card-regime" : "")].filter(Boolean).join(" ");
        const valCls = isRegime ? "val val-regime" : "val";
        return `<div class="${cardCls}"><h3>${esc(l)}</h3><div class="${valCls}" style="color:${c || "var(--gold-light)"}">${v}</div></div>`;
      }).join("")}</div>`;
    }

    function paintRegimePanel(ov, bsv32, perfBase, perf) {

        : (perf?.win_rate != null ? (perf.win_rate * 100).toFixed(1) + "%" : "—");

      $("regime").innerHTML = hero("Market Regime Analysis", "BSv3.2 regime classification and baseline performance") + `
        <div class="block"><h3>Current Regime</h3>
          ${cards([
            ["Regime", esc(regimeLabel)],
            ["NFP Blackout", sys.nfp_blackout ? "ACTIVE" : "Clear", sys.nfp_blackout ? "var(--amber)" : "var(--green)"],
            ["System Status", esc(formatRegimeLabel(sys.status || ov.bsv32_status || "unknown"))],
            ["Win Rate", winRate],
          ])}
        </div>
        ${hasPerf ? `<div class="block"><h3>Performance vs Baseline</h3>
          ${cards([
            ["Expectancy", fmt(perfBase?.expectancy ?? perf?.expectancy)],
            ["Edge Decay", fmt(perfBase?.edge_decay_score ?? perf?.edge_decay_score, 2)],

          ])}
          ${(perfBase?.anomaly_flags || []).length ? `<p class="muted" style="margin-top:.75rem">${esc(perfBase.anomaly_flags.join(", "))}</p>` : ""}
        </div>` : `<div class="block"><p class="muted">Performance metrics loading…</p></div>`}`;
      $("regime-badge").textContent = `${regimeLabel} regime`;
      $("regime-badge").className = "badge badge-gold";

    function renderSubscriptionReminders(sub) {
      const list = sub?.subscriptions || [];
      if (!list.length) return "";
      const rows = list.map((s) => {
        const st = s.status || "ok";
        const cls = st === "expired" || st === "urgent" ? "badge-err" : st === "soon" ? "badge-warn" : "badge-ok";
        const days = s.days_left;
        const daysLabel = days == null ? "—" : days < 0 ? `${Math.abs(days)}d overdue` : `${days} days left`;
        const meta = [s.plan, s.billing_status].filter(Boolean).join(" · ");
        return `<div class="svc">
          <div>
            <strong>${esc(s.label)}</strong>
            ${meta ? `<div class="muted">${esc(meta)}</div>` : ""}
            <div class="muted">Expires ${esc(s.display_date || s.expires_on)} · ${esc(daysLabel)}</div>
            ${s.notes ? `<div class="muted" style="font-size:.8rem;margin-top:.25rem">${esc(s.notes)}</div>` : ""}
          </div>
          <span class="badge ${cls}">${st === "expired" ? "EXPIRED" : st.toUpperCase()}</span>
        </div>`;
      }).join("");
      return `<div class="block"><h3>Subscription renewals</h3><p class="muted" style="margin-bottom:.75rem">Always visible — renew before expiry to avoid downtime.</p>${rows}</div>`;

    function pctRate(n, decimals = 1) {
      if (n == null || n === "") return "—";
      return (Number(n) * 100).toFixed(decimals) + "%";
    }

    function pipVal(n) {
      if (n == null || n === "") return "—";
      return Number(n).toFixed(2) + " pips";
    }

    function msVal(n) {
      if (n == null || n === "") return "—";
      return Math.round(Number(n)) + " ms";
    }

    function renderExecutionQuality(eq) {
      if (!eq) return `<p class="muted">Awaiting trade execution data</p>`;
      if (eq.message === "no_execution_data" || ((eq.sample_size ?? 0) === 0 && eq.avg_slippage_pips == null)) {
        return `<p class="muted">No execution samples in the last 24 hours. Metrics appear here after live fills are logged.</p>`;
      }
      const trend = eq.slippage_trend || {};
      const trendLabel = trend.worsening ? "Worsening" : "Stable";
      const trendColor = trend.worsening ? "var(--amber)" : "var(--green)";
      const anomalies = eq.anomaly_count ?? 0;
      let html = cards([
        ["Trades Analyzed", eq.sample_size ?? 0],
        ["Avg Slippage", pipVal(eq.avg_slippage_pips)],
        ["Avg Fill Speed", msVal(eq.avg_fill_speed_ms)],
        ["Rejection Rate", pctRate(eq.rejection_rate)],
        ["Anomalies", anomalies, anomalies > 0 ? "var(--amber)" : "var(--green)"],
      ]);
      html += `<div style="margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--border)">
        <p class="muted" style="font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem">Slippage trend · last 24h vs prior 24h</p>
        <div class="svc"><span>Recent period</span><span>${pipVal(trend.recent_avg)}</span></div>
        <div class="svc"><span>Prior period</span><span>${pipVal(trend.prior_avg)}</span></div>
        <div class="svc"><span>Trend</span><span style="color:${trendColor};font-weight:600">${trendLabel}</span></div>
      </div>`;
      if (eq.recommendation) {
        html += `<p style="margin-top:.85rem;padding:.75rem 1rem;border-left:3px solid var(--amber);background:rgba(251,191,36,.08);font-size:.9rem;line-height:1.45"><strong>Recommendation:</strong> ${esc(eq.recommendation)}</p>`;
      } else if (!trend.worsening) {
        html += `<p class="muted" style="margin-top:.75rem">Execution quality is within normal range.</p>`;
      }
      return html;
    }

    function renderPerformanceIntel(perf) {
      if (!perf) return `<p class="muted">Daily report generates on the performance intelligence schedule.</p>`;
      const flags = perf.anomaly_flags || [];
      const wr = perf.win_rate != null ? (perf.win_rate * 100).toFixed(1) + "%" : "—";
      const pnl = perf.total_pnl_usd;
      const pnlColor = pnl == null ? null : pnl >= 0 ? "var(--green)" : "var(--red)";
      let html = `<p class="muted" style="margin-bottom:.75rem">Report date: <strong style="color:var(--text)">${esc(perf.report_date || "—")}</strong></p>`;
      html += cards([
        ["Trades", perf.total_trades ?? 0],
        ["Win Rate", wr],
        ["Expectancy", fmt(perf.expectancy)],
        ["Avg R-Multiple", fmt(perf.avg_r_multiple)],
        ["Total P&L", "$" + fmt(perf.total_pnl_usd), pnlColor],
        ["Edge Decay", fmt(perf.edge_decay_score, 2)],
      ]);
      if (flags.length) {
        html += `<p class="muted" style="margin-top:.85rem;margin-bottom:.35rem"><strong>Anomaly flags</strong></p><ul style="margin-left:1.15rem;line-height:1.5;color:var(--amber)">`;
        flags.forEach((f) => {
          html += `<li>${esc(typeof f === "string" ? f : String(f))}</li>`;

        html += `<p class="muted" style="margin-top:.75rem">No performance anomalies flagged.</p>`;

        }
        html += `</div>`;
      });

      const syn = v.ceo_strategic_synthesis || {};
      html += `<div class="block"><h3>CEO Strategic Synthesis</h3>`;
      Object.entries(syn).forEach(([k, val]) => {
        if (val) html += `<p style="margin:.5rem 0"><strong>${esc(k.replace(/_/g," "))}:</strong> ${esc(val)}</p>`;
      });
      html += `</div>`;

      const board = v.ceo_action_board || [];
      if (board.length) {
        html += `<div class="block"><h3>CEO Action Board</h3><table class="data-table"><thead><tr><th>P</th><th>Action</th><th>Owner</th><th>Deadline</th><th>Impact</th></tr></thead><tbody>`;
        board.forEach(row => {
          html += `<tr><td>${row.priority}</td><td>${esc(row.action)}</td><td>${esc(row.owner)}</td><td>${esc(row.deadline)}</td><td>${esc(row.impact)}</td></tr>`;
        });
        html += `</tbody></table></div>`;
      }

      const dec = v.ceo_decision_board || [];
      html += `<div class="block"><h3>Decisions Billy Must Make Today</h3>`;
      if (!dec.length) html += `<p class="muted">No mandatory decisions flagged today.</p>`;
      dec.forEach((d, i) => {
        html += `<div class="row" style="flex-direction:column;align-items:flex-start;gap:.35rem">
          <strong>${i+1}. ${esc(d.decision)}</strong>
          <span class="muted">${esc(d.why_it_matters)}</span>
          <span>Recommendation: ${esc(d.recommendation)}</span>
        </div>`;
      });
      html += `</div>`;

      const cmd = v.commander_assessment || {};
      html += `<div class="block"><h3>Mission Control Commander Assessment</h3>`;
      html += `<p><em>If I were CEO today, these are the 3 actions I would take immediately:</em></p><ol>`;
      (cmd.immediate_actions || []).forEach(a => { html += `<li>${esc(a)}</li>`; });
      html += `</ol><p style="margin-top:.75rem">${esc(cmd.reasoning || "")}</p></div>`;

      if (v.rendered_markdown) {
        html += `<div class="block"><button type="button" class="read-hint" style="cursor:pointer;border:1px solid var(--border);padding:.5rem 1rem;background:transparent;color:var(--gold-light)" onclick="openReader('Full briefing (text)','${esc(v.briefing_date)}', document.getElementById('briefing-md-store').textContent)">Open printable briefing</button></div>`;
        html += `<pre id="briefing-md-store" style="display:none">${esc(v.rendered_markdown)}</pre>`;
      }
      return html;
    }

    function outcomeClass(o) {
      if (o === "win") return "outcome-win";
      if (o === "loss") return "outcome-loss";
      if (o === "open") return "outcome-open";
      return "outcome-be";
    }

    function openReader(title, meta, body, tags) {
      $("reader-title").textContent = title || "Untitled";
      $("reader-meta").textContent = meta || "";
      $("reader-body").textContent = body || "No content available.";
      const tagEl = $("reader-tags");
      if (tags && tags.length) {
        tagEl.style.display = "flex";
        tagEl.innerHTML = tags.map(t => `<span>${esc(t)}</span>`).join("");
      } else {
        tagEl.style.display = "none";
        tagEl.innerHTML = "";
      }
      $("reader-modal").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeReader() {
      $("reader-modal").classList.remove("open");
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeReader();
    });

    function clickableRow(title, subtitle, hint, onclickJs) {
      return `<div class="row clickable" onclick="${onclickJs}">
        <div><strong>${esc(title)}</strong><br><span class="muted">${esc(subtitle)}</span></div>
        <span class="read-hint">${hint || "Read"}</span>
      </div>`;
    }

    function openMktArticle(idx) {
      const i = window.__mktQueue?.[idx];
      if (!i) return;
      openReader(
        i.title || i.platform,
        [i.platform, i.pillar, i.content_type, i.status].filter(Boolean).join(" · "),
        i.body,
        i.hashtags
      );
    }

    function openResearchItem(idx) {
      const r = window.__research?.[idx];
      if (!r) return;
      const body = (r.recommendation || "") + "\n\nEvidence:\n" + JSON.stringify(r.evidence || {}, null, 2);
      openReader(r.title, [r.finding_type, r.severity].filter(Boolean).join(" · "), body);
    }

    function openAlertItem(idx) {
      const a = window.__alerts?.[idx];
      if (!a) return;
      openReader(a.title, [a.severity, a.agent_source, (a.created_at || "").slice(0, 19)].filter(Boolean).join(" · "), a.message);
    }

    function openTrendItem(idx) {
      const t = window.__mktTrends?.[idx];
      if (!t) return;
      openReader(t.topic, [t.category, "relevance " + fmt(t.relevance_score, 2)].filter(Boolean).join(" · "), t.suggested_angle || "No angle suggested yet.");
    }

    function tradeHistoryTable(rows) {
      if (!rows || !rows.length) {
        return `<p class="muted">No trades recorded yet — closed positions will appear after MT5 exit</p>`;
      }
      const head = `<tr><th>Time</th><th>Symbol</th><th>Dir</th><th>Outcome</th><th>Entry</th><th>Exit</th><th>P&L</th></tr>`;
      const body = rows.map(t => {
        const ts = (t.created_at || "").slice(0, 16).replace("T", " ");
        const oc = t.outcome || "open";
        const pnl = t.pnl_usd != null ? "$" + fmt(t.pnl_usd) : "—";
        const pnlColor = oc === "win" ? "var(--green)" : oc === "loss" ? "var(--red)" : "var(--muted)";
        return `<tr>
          <td class="muted">${esc(ts)}</td>
          <td>${esc(t.symbol)}</td>
          <td>${esc(t.direction)}</td>
          <td class="${outcomeClass(oc)}">${esc(oc)}</td>
          <td>${fmt(t.entry_price)}</td>
          <td>${t.exit_price != null ? fmt(t.exit_price) : "—"}</td>
          <td style="color:${pnlColor}">${pnl}</td>
        </tr>`;
      }).join("");
      return `<table class="trade-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
    }

    let missionDataReady = false;
    let refreshInFlight = false;

    function paintBriefingPanels(b, ov, perf) {
      const perfBase = b.performance_vs_baseline || {};
      const staleNote = b._stale
        ? `<p class="muted" style="margin-bottom:.75rem">Showing cached briefing from ${esc(b._cached_date)} — today's run is scheduled for 09:00 Kampala.</p>`
        : "";
      $("executive").innerHTML = staleNote + renderExecutiveBriefing(b) + `
        <div class="block"><h3>Financial Snapshot</h3>
          ${cards([
            ["Live P&L", "$"+fmt(b.pnl?.live_pnl), (b.pnl?.live_pnl||0)>=0?"var(--green)":"var(--red)"],
            ["Daily P&L", "$"+fmt(b.pnl?.daily_pnl)],
            ["Account Equity", "$"+fmt(b.pnl?.account_equity)],
            ["Risk Score", fmt(b.risk?.risk_score,1)],
            ["Drawdown", fmt(b.risk?.drawdown_pct,1)+"%"],
            ["Infra Score", fmt((b.infrastructure?.health_score||0)*100,0)+"%"],
          ])}
        </div>`;
      paintRegimePanel(ov, b.bsv32_system, perfBase, perf);
    }

    function paintSecondaryPanels(ov, infra, risk, perf, execQ, trades, mktStats, mktQueue, mktTrends, alerts, research) {
      if (infra?.current) {
        const svc = infra.current.services || {};
        const v = infra.current.vps || {};
        $("infrastructure").innerHTML = hero("Infrastructure Command", "VPS, APIs, subscriptions, and execution layer health") + `
          <div style="margin-bottom:1rem">${badge(infra.current.healthy, infra.current.healthy ? "All Systems Operational" : "Degraded")}</div>
          <div class="block"><h3>Service Endpoints</h3>
            ${Object.entries(svc).map(([n,s]) =>
              `<div class="svc"><span>${esc(n.replace(/_/g," "))}</span>${badge(s.ok, s.ok ? (s.latency_ms+"ms") : "DOWN")}</div>`
            ).join("")}
          </div>
          <div class="block"><h3>VPS Resources</h3>
            ${cards([["CPU", fmt(v.cpu_pct,1)+"%"], ["RAM", fmt(v.ram_pct,1)+"%"], ["Disk", fmt(v.disk_pct,1)+"%"]])}
          </div>
          ${renderSubscriptionReminders(infra.subscriptions)}`;
      } else if (infra?.subscriptions?.subscriptions?.length) {
        $("infrastructure").innerHTML = hero("Infrastructure Command", "VPS, APIs, subscriptions, and execution layer health")
          + `<div class="block"><p class="muted">Live health metrics loading…</p></div>`
          + renderSubscriptionReminders(infra.subscriptions);
      }

      $("analytics").innerHTML = hero("Quant Analytics", "Performance intelligence and execution quality") + `
        <div class="block"><h3>Trade History</h3>
          ${tradeHistoryTable(trades)}
        </div>
        <div class="block"><h3>Performance Intelligence</h3>
          ${renderPerformanceIntel(perf)}
        </div>
        <div class="block"><h3>Execution Quality</h3>
          ${renderExecutionQuality(execQ)}
        </div>
        ${risk ? `<div class="block"><h3>Risk Orchestrator</h3>${cards([
          ["Risk Score", fmt(risk.risk_score,1)],
          ["Drawdown", fmt(risk.account_drawdown_pct,1)+"%"],
          ["Lot Scaling", fmt(risk.lot_scaling_factor,2)],
          ["Kill Switch", risk.kill_switch_recommended ? "RECOMMENDED" : "Clear", risk.kill_switch_recommended ? "var(--red)" : "var(--green)"],
        ])}</div>` : ""}`;

      window.__mktQueue = mktQueue;
      window.__mktTrends = mktTrends || [];
      window.__research = research || [];
      window.__alerts = alerts || [];

      $("marketing").innerHTML = hero("Marketing Intelligence", "Brand content pipeline and trend signals · click an article to read") + `
        <div class="block"><h3>Content Pipeline</h3>
          ${mktStats ? cards([
            ["Drafts", mktStats.draft_count ?? 0],
            ["Approved", mktStats.approved_count ?? 0],
          ]) : `<p class="muted">Marketing agent loading…</p>`}
        </div>
        <div class="block"><h3>Content Queue</h3>
          ${(mktQueue||[]).map((i, idx) => clickableRow(
            i.title || i.platform,
            `${i.platform} · ${i.pillar || i.content_type || ""} · ${i.status || "draft"}`,
            "Read article",
            `openMktArticle(${idx})`
          )).join("") || `<p class="muted">No content in queue</p>`}
        </div>
        <div class="block"><h3>Trend Signals</h3>
          ${(mktTrends||[]).map((t, idx) => clickableRow(
            t.topic,
            t.suggested_angle || t.category || "",
            "Read",
            `openTrendItem(${idx})`
          )).join("") || `<p class="muted">No trends detected yet</p>`}
        </div>`;

      $("alerts").innerHTML = hero("Alerts & Research", "System alerts and quant research · click to read full detail") + `
        <div class="block"><h3>Active Alerts (${(alerts||[]).length})</h3>
          ${(alerts||[]).map((a, idx) => clickableRow(
            a.title,
            `${a.severity} · ${(a.created_at||"").slice(0,19)}`,
            "Read",
            `openAlertItem(${idx})`
          )).join("") || `<p class="muted">No active alerts</p>`}
        </div>
        <div class="block"><h3>Research Queue (${(research||[]).length})</h3>
          ${(research||[]).map((r, idx) => clickableRow(
            r.title,
            `${r.finding_type} · ${r.severity}`,
            "Read",
            `openResearchItem(${idx})`
          )).join("") || `<p class="muted">No pending research</p>`}
        </div>`;
    }

    async function load(opts = {}) {
      const initial = opts.initial ?? !missionDataReady;
      if (refreshInFlight) return;
      refreshInFlight = true;
      const prevStatus = $("status").textContent;
      try {
        if (initial) {
          $("status").textContent = "Loading snapshot…";
          ["executive", "allocator", "regime", "infrastructure", "analytics", "marketing", "alerts"].forEach((id) => {
            $(id).innerHTML = loadingBlock("Loading…");
          });
        } else if (!document.hidden) {
          $("status").textContent = "Refreshing…";
        }

        const ov = await get("/dashboard/overview?live=true", 12000);
        paintOverview(ov, { initial: true });
        paintRegimePanel(ov);

        const registryP = get("/agents/registry", 12000);
        const agentsHealthP = get("/agents/health", 12000).catch(() => ({ agents: [] }));
        const auditP = get("/dashboard/audit-trail?limit=30", 12000).catch(() => ({ items: [] }));
        const perfP = get("/dashboard/performance", 12000).catch(() => null);
        const panelsP = Promise.allSettled([
          get("/dashboard/infrastructure", 15000),
          get("/dashboard/risk", 12000).catch(() => null),
          perfP,
          get("/dashboard/execution-quality", 12000).catch(() => null),
          get("/dashboard/trades?limit=25", 12000).catch(() => []),
          get("/marketing/stats", 12000).catch(() => null),
          get("/marketing/queue?status=draft&limit=24", 12000).catch(() => []),
          get("/marketing/queue?status=approved&limit=10", 12000).catch(() => []),
          get("/marketing/trends?limit=6", 12000).catch(() => []),
          get("/dashboard/alerts?limit=12", 12000).catch(() => []),
          get("/dashboard/research?status=pending&limit=10", 12000).catch(() => []),
        ]);
        const briefingP = get("/dashboard/briefing", 8000).catch(() => null);
        const allocatorP = get("/dashboard/allocator-readiness", 12000).catch(() => null);

        const [registry, agentsHealth, audit, panelResults, briefingRaw, perfEarly, allocatorRaw] = await Promise.all([
          registryP,
          agentsHealthP,
          auditP,
          panelsP,
          briefingP,
          perfP,
          allocatorP,
        ]);
        paintAgents(registry, agentsHealth, audit);

        const val = (r) => (r.status === "fulfilled" ? r.value : null);
        const [
          infra, risk, perf, execQ, trades, mktStats, mktDraft, mktApproved, mktTrends, alerts, research,
        ] = panelResults.map(val);
        const mktQueue = [...(mktDraft || []), ...(mktApproved || [])];
        const briefing = briefingRaw && briefingRaw.ready === false ? null : briefingRaw;

        const perfResolved = perf || perfEarly;
        const allocPayload = allocatorRaw || briefing?.allocator_progress || null;
        if (allocPayload && !allocPayload.gates && allocPayload.blockers) {
          window.__allocator = {
            check_ready: allocPayload.check_ready,
            progress_score: allocPayload.progress_score,
            tier: allocPayload.tier,
            gates_passed: (allocPayload.gates || []).filter(g => g.pass).length,
            gates_total: (allocPayload.gates || []).length || 9,
            gates: allocPayload.gates || [],
            blockers: allocPayload.blockers,
            next_milestones: allocPayload.next_milestones || [],
            live_closed_trades: allocPayload.jcm_trades?.closed ?? 0,
            live_closed_target: 50,
            stale_jcm_opens: allocPayload.stale_jcm_opens ?? 0,
            research_pf: allocPayload.research?.profit_factor,
            research_trades: allocPayload.research?.trades,
            headline: allocPayload.check_ready
              ? "Allocator check-ready"
              : `Allocator progress ${allocPayload.progress_score}/100`,
          };
        } else if (allocPayload) {
          window.__allocator = {
            check_ready: allocPayload.check_ready,
            progress_score: allocPayload.progress_score,
            tier: allocPayload.tier,
            gates_passed: (allocPayload.gates || []).filter(g => g.pass).length,
            gates_total: (allocPayload.gates || []).length || 9,
            gates: allocPayload.gates || [],
            blockers: allocPayload.blockers || [],
            next_milestones: allocPayload.next_milestones || [],
            live_closed_trades: allocPayload.jcm_trades?.closed ?? allocPayload.live_closed_trades ?? 0,
            live_closed_target: 50,
            stale_jcm_opens: allocPayload.stale_jcm_opens ?? 0,
            research_pf: allocPayload.research?.profit_factor ?? allocPayload.research_pf,
            research_trades: allocPayload.research?.trades ?? allocPayload.research_trades,
            headline: allocPayload.headline || (allocPayload.check_ready ? "Check-ready" : `Progress ${allocPayload.progress_score}/100`),
          };
        } else if (briefing?.allocator_progress) {
          window.__allocator = briefing.allocator_progress;
        }
        paintAllocatorPanel(window.__allocator);
        const strip = document.getElementById("allocator-overview-strip");
        if (strip && window.__allocator) {
          strip.outerHTML = renderAllocatorStrip(window.__allocator);
        } else if (window.__allocator && $("overview").dataset.liveReady) {
          const ovHero = $("overview").querySelector(".hero");
          if (ovHero && !$("overview").querySelector("#allocator-overview-strip")) {
            ovHero.insertAdjacentHTML("afterend", renderAllocatorStrip(window.__allocator));
          }
        }

        if (briefing) {
          paintBriefingPanels(briefing, ov, perfResolved);
        } else {
          paintRegimePanel(ov, null, null, perfResolved);
          if (initial || !$("executive").innerHTML.includes("Executive")) {
            $("executive").innerHTML = hero("Executive Briefing", "Awaiting CEO Copilot data") + `<div class="block"><p class="muted">Briefing will populate on next agent cycle (09:00 Kampala)</p></div>`;
          }
        }

        paintSecondaryPanels(ov, infra, risk, perf, execQ, trades, mktStats, mktQueue, mktTrends, alerts, research);

        missionDataReady = true;
        $("status").textContent = "Live · " + new Date().toLocaleTimeString();
        hideLoginGate();
      } catch (e) {
        if (e.message === "login_required") {
          showLoginGate("Session expired. Sign in again.");
          $("status").textContent = "Sign in required";
          return;
        }
        if (!missionDataReady) {
          $("status").textContent = "Error: " + e.message;
          $("overview").innerHTML = `<div class="block"><p class="muted">Could not load data: ${esc(e.message)}</p></div>`;
        } else {
          $("status").textContent = prevStatus || "Live";
        }
      } finally {
        refreshInFlight = false;
      }
    }

    async function boot() {
      if (!getMcAuth()) {
        showLoginGate();
        return;
      }
      hideLoginGate();
      show("overview", "Command Overview");
      await load({ initial: true });
      connectMissionWs();
      setInterval(() => {
        if (!document.hidden) refreshLiveTick();
      }, LIVE_POLL_MS);
      setInterval(() => {
        if (!document.hidden) load({ initial: false });
      }, 45000);
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && missionDataReady && getMcAuth()) {
        refreshLiveTick();
        load({ initial: false });
      }
    });

    $("login-btn").onclick = async () => {
      const u = $("login-user").value.trim();
      const p = $("login-pass").value;
      if (!u || !p) {
        showLoginGate("Enter email and password.");
        return;
      }
      setMcAuth(u, p);
      hideLoginGate();
      $("login-err").style.display = "none";
      try {
        await get("/dashboard/overview");
        await boot();
      } catch (e) {
        clearMcAuth();
        showLoginGate("Invalid credentials. Try again.");
      }
    };

    $("login-pass").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("login-btn").click();
    });

    boot();
  </script>
</body>
</html>
